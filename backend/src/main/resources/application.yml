spring:
  application:
    name: medagenda
  # Local runs use the "dev" profile (sample data) unless SPRING_PROFILES_ACTIVE says otherwise
  profiles:
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medagenda}
    username: ${DB_USERNAME:medagenda}
    password: ${DB_PASSWORD:medagenda}
  jpa:
    # Flyway owns the schema; Hibernate only checks that entities match it
    hibernate:
      ddl-auto: validate
    # Forces all lazy loading to happen inside service transactions, never during JSON rendering
    open-in-view: false
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  # Validation and error messages are shown to Brazilian users
  web:
    locale: pt_BR
    locale-resolver: fixed
  # Legacy admin module: controllers return a view name, resolved to /WEB-INF/jsp/<name>.jsp.
  # Files under WEB-INF cannot be requested directly by a browser, only rendered by a controller.
  mvc:
    view:
      prefix: /WEB-INF/jsp/
      suffix: .jsp

server:
  servlet:
    session:
      # Only the JSP admin module uses a session (the REST API is stateless)
      timeout: 30m
      # Cookie only: URL rewriting would append ";jsessionid=..." to links, which Spring Security's
      # firewall rejects (and which leaks the session id in logs and referrers)
      tracking-modes: cookie
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

medagenda:
  scheduling:
    # Appointment times are clinic-local; "now" is always read in this zone, whatever the
    # server/container time zone is
    clinic-zone: America/Sao_Paulo
    max-days-ahead: 90
    min-cancellation-notice: PT24H
  security:
    jwt:
      # Base64 key with at least 256 bits. No default on purpose: outside "dev" the app
      # refuses to start without JWT_SECRET instead of running with a known key.
      secret: ${JWT_SECRET:}
      issuer: medagenda
      expiration: ${JWT_EXPIRATION:PT2H}
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

springdoc:
  # Document only the REST API; the JSP admin pages are not part of it
  paths-to-match: /api/**
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
